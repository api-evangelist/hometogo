aid: hometogo
name: HomeToGo
description: 'HomeToGo is the world''s largest marketplace and search engine for vacation
  rentals, aggregating roughly 20 million offers from thousands of providers worldwide
  across cabins, condos, houses, and apartments. Its B2B segment, HomeToGo_PRO, powers
  the supply side of travel with SaaS and tech-enabled services for individual hosts,
  property managers, and agencies. Through its Doppelgänger program HomeToGo offers
  partners multiple integration surfaces — API, White Label, Travel Agency Hub, ad
  placement, and pop-under — to embed its vacation-rental inventory. HomeToGo is a
  publicly listed company (Frankfurt Stock Exchange) and a portfolio company of Insight
  Partners. It does not publish a public, self-serve API specification; API access
  is arranged through its partner and supply programs.'
